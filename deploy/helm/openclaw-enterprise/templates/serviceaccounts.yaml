{{- include "openclaw.validate" . -}}
{{- range $component := list "api" "worker" "initialization" "driver-lifecycle" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-enterprise-{{ $component }}
  labels:
    {{- include "openclaw.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- if or (eq $component "initialization") (eq $component "driver-lifecycle") }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
automountServiceAccountToken: {{ or (eq $component "api") (eq $component "worker") }}
{{- end }}
