name: Run CI lane
description: Set up tools, run one CI lane, clean up owned resources, and upload results.
inputs:
  lane:
    description: Lane name passed to the CI runner.
    required: true
  profile:
    description: Tool setup profile passed to scripts/ci/setup-tools.sh.
    required: true
  node-version:
    description: Node.js version used by the workspace.
    required: true
  artifact-prefix:
    description: Prefix for the uploaded result artifact.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ inputs.node-version }}
    - id: pnpm-store
      uses: openclaw/openclaw/.github/actions/setup-pnpm-store-cache@97abb65691d97ee95c977a9a4ede2ef221d6929c
      with:
        node-version: ${{ inputs.node-version }}
        cache-mode: read-write
    - uses: ./.github/actions/setup-test-docker
      if: inputs.lane == 'docker-model' || inputs.lane == 'logging-collector'
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      if: inputs.profile == 'full' || inputs.profile == 'images' || inputs.profile == 'k3d'
    - name: Set up CI tools
      shell: bash
      run: bash scripts/ci/setup-tools.sh "${{ inputs.profile }}"
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && steps.pnpm-store.outputs.store-cache-hit != 'true'
      with:
        path: ${{ steps.pnpm-store.outputs.store-path }}
        key: ${{ steps.pnpm-store.outputs.store-cache-primary-key }}
    - name: Install browser dependencies
      if: inputs.lane == 'checks-baseline'
      shell: bash
      run: bash scripts/ci/setup-tools.sh browser
    - name: Run workspace boundary check
      if: inputs.lane == 'checks-baseline'
      shell: bash
      run: pnpm check:workspace
    - name: Run format check
      if: inputs.lane == 'checks-baseline'
      shell: bash
      run: pnpm format:check
    - name: Run OpenAPI check
      if: inputs.lane == 'checks-baseline'
      shell: bash
      run: pnpm openapi:check
    - name: Run typecheck
      if: inputs.lane == 'checks-baseline'
      shell: bash
      run: pnpm typecheck
    - name: Select logging collector Node image
      if: inputs.lane == 'logging-collector'
      shell: bash
      run: echo "OCC_TEST_LOGGING_NODE_IMAGE=node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584" >> "$GITHUB_ENV"
    - name: Select image build Node base
      if: inputs.lane == 'images-packaging'
      shell: bash
      run: echo "NODE_BASE_IMAGE=node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584" >> "$GITHUB_ENV"
    - name: Prepare lane
      shell: bash
      run: node scripts/ci/prepare.mjs --lane "${{ inputs.lane }}" --state "$RUNNER_TEMP/state/${{ inputs.lane }}.json" --github-env "$GITHUB_ENV"
    - name: Run lane
      shell: bash
      run: node scripts/ci/run-tests.mjs run "${{ inputs.lane }}" --state "$RUNNER_TEMP/state/${{ inputs.lane }}.json" --results "$RUNNER_TEMP/results/${{ inputs.lane }}.json"
    - name: Cleanup lane
      if: always()
      shell: bash
      run: node scripts/ci/cleanup.mjs --state "$RUNNER_TEMP/state/${{ inputs.lane }}.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ${{ inputs.artifact-prefix }}-${{ inputs.lane }}
        path: ${{ runner.temp }}/results/${{ inputs.lane }}.json
        if-no-files-found: error
        retention-days: 7
