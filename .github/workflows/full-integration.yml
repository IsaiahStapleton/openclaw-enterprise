  full-aggregate:
    name: Full Integration Aggregate
    runs-on: ubuntu-24.04
    needs:
      - preflight
      - pr-safe-same-sha
      - docker-model
      - k3d-model
      - gateway-routing
      - production-tui
      - slack
      - provider-account
      - openshell
      - k3d-otel
      - helper-timeout
      - logging-collector
    if: always()
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: full-results-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - name: Write selected job state
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          LANE: ${{ inputs.lane }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const lane = process.env.LANE;
          const out = { preflight: needs.preflight };
          if (lane === "all") {
            for (const name of ["checks-baseline", "postgres", "images-packaging", "k3d-fixture-configuration", "logging-collector"]) {
              out[name] = { result: needs["pr-safe-same-sha"]?.result ?? "missing" };
            }
          } else if (lane === "logging-collector") {
            out["logging-collector"] = needs["logging-collector"] ?? { result: "missing" };
          }
          for (const name of ["docker-model", "k3d-model", "gateway-routing", "production-tui", "slack", "provider-account", "openshell", "helper-timeout", "k3d-otel"]) {
            if (lane === "all" || lane === name) {
              out[name] = needs[name] ?? { result: "missing" };
            }
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/needs.json`, JSON.stringify(out));
          NODE
      - name: Aggregate targeted runtime results
        if: needs.preflight.outputs.run_all != 'true'
        run: node scripts/ci/run-tests.mjs aggregate "${{ inputs.lane }}" --results-dir "$RUNNER_TEMP/results" --needs "$RUNNER_TEMP/needs.json"
      - name: Aggregate full suite
        if: needs.preflight.outputs.run_all == 'true'
        run: node scripts/ci/run-tests.mjs aggregate full --results-dir "$RUNNER_TEMP/results" --needs "$RUNNER_TEMP/needs.json"
