name: Full Integration

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Integration lane to run.
        required: true
        default: docker-model
        type: choice
        options:
          - docker-model
          - k3d-model
          - gateway-routing
          - production-tui
          - slack
          - provider-account
          - openshell
          - helper-timeout
          - logging-collector
          - k3d-otel
          - all

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: full-integration
  cancel-in-progress: false

env:
  CI: "1"
  NODE_VERSION: "24.16.0"

jobs:
  preflight:
    name: Dispatch Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_all: ${{ steps.select.outputs.run_all }}
    steps:
      - name: Require main dispatch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Full integration must be dispatched from main at the approved github.sha."
          exit 1
      - name: Validate lane selection
        id: select
        env:
          LANE: ${{ inputs.lane }}
        run: |
          node <<'NODE'
          const lane = process.env.LANE;
          const lanes = new Set(["docker-model", "k3d-model", "gateway-routing", "production-tui", "slack", "provider-account", "openshell", "helper-timeout", "logging-collector", "k3d-otel", "all"]);
          if (!lanes.has(lane)) {
            throw new Error(`Unknown lane: ${lane}`);
          }
          require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `run_all=${lane === "all"}\n`);
          NODE
      - name: Verify protected environments exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LANE: ${{ inputs.lane }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.REPOSITORY;
          const selected = process.env.LANE;
          const laneEnvironments = {
            "docker-model": "integration-model",
            "k3d-model": "integration-model",
            "production-tui": "integration-model",
            "k3d-otel": "integration-otel",
            "gateway-routing": "integration-routing",
            slack: "integration-slack",
            "provider-account": "integration-provider-account",
            openshell: "integration-openshell",
          };
          const required = [...new Set(Object.entries(laneEnvironments)
            .filter(([lane]) => selected === "all" || selected === lane)
            .map(([, environment]) => environment))];
          async function github(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
                "User-Agent": "openclaw-enterprise-full-integration",
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${path} returned ${response.status}.`);
            }
            return response.json();
          }
          for (const environment of required) {
            const body = await github(`/environments/${environment}`);
            const requiredReviewers = body.protection_rules?.find((rule) => rule.type === "required_reviewers");
            if (!requiredReviewers) {
              throw new Error(`Protected environment ${environment} has no required reviewers.`);
            }
            if (requiredReviewers.prevent_self_review !== true) {
              throw new Error(`Protected environment ${environment} does not prevent self-review.`);
            }
            const policy = body.deployment_branch_policy;
            if (policy?.protected_branches === true) {
              continue;
            }
            if (policy?.custom_branch_policies !== true) {
              throw new Error(`Protected environment ${environment} is not restricted to protected branches or main.`);
            }
            const policies = await github(`/environments/${environment}/deployment-branch-policies`);
            if (!policies.branch_policies?.some((branch) => branch.name === "main")) {
              throw new Error(`Protected environment ${environment} has no main deployment branch policy.`);
            }
          }
          NODE

  pr-safe-same-sha:
    name: Same-SHA ${{ matrix.title }}
    runs-on: ubuntu-24.04
    needs: preflight
    if: needs.preflight.outputs.run_all == 'true'
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: checks-baseline
            title: Checks, Conformance, Browser
            profile: baseline
            timeout: 25
          - lane: postgres
            title: PostgreSQL
            profile: postgres
            timeout: 25
          - lane: images-packaging
            title: Images and Packaging
            profile: images
            timeout: 45
          - lane: k3d-fixture-configuration
            title: k3d Fixture and Configuration
            profile: k3d
            timeout: 45
          - lane: logging-collector
            title: Logging Collector
            profile: images
            timeout: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: pnpm-store
        uses: openclaw/openclaw/.github/actions/setup-pnpm-store-cache@97abb65691d97ee95c977a9a4ede2ef221d6929c
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: read-write
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: matrix.profile == 'images' || matrix.profile == 'k3d'
      - run: bash scripts/ci/setup-tools.sh "${{ matrix.profile }}"
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: success() && steps.pnpm-store.outputs.store-cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: ${{ steps.pnpm-store.outputs.store-cache-primary-key }}
      - if: matrix.lane == 'checks-baseline'
        run: bash scripts/ci/setup-tools.sh browser
      - if: matrix.lane == 'checks-baseline'
        run: pnpm check:workspace
      - if: matrix.lane == 'checks-baseline'
        run: pnpm format:check
      - if: matrix.lane == 'checks-baseline'
        run: pnpm openapi:check
      - if: matrix.lane == 'checks-baseline'
        run: pnpm typecheck
      - if: matrix.lane == 'logging-collector'
        run: echo "OCC_TEST_LOGGING_NODE_IMAGE=node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584" >> "$GITHUB_ENV"
      - if: matrix.lane == 'images-packaging'
        run: echo "NODE_BASE_IMAGE=node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584" >> "$GITHUB_ENV"
      - run: node scripts/ci/prepare.mjs --lane "${{ matrix.lane }}" --state "$RUNNER_TEMP/state/${{ matrix.lane }}.json" --github-env "$GITHUB_ENV"
      - run: node scripts/ci/run-tests.mjs run "${{ matrix.lane }}" --state "$RUNNER_TEMP/state/${{ matrix.lane }}.json" --results "$RUNNER_TEMP/results/${{ matrix.lane }}.json"
      - if: always()
        run: node scripts/ci/cleanup.mjs --state "$RUNNER_TEMP/state/${{ matrix.lane }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-results-${{ matrix.lane }}
          path: ${{ runner.temp }}/results/${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 7

  docker-model:
    name: Docker Model Runtime
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'docker-model'
    timeout-minutes: 40
    environment: integration-model
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_DOCKER_RUNTIME_IMAGE: ${{ vars.OCC_DOCKER_RUNTIME_IMAGE }}
      NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE }}
      OCC_TEST_OTEL_LOGS_URL: ${{ vars.OCC_TEST_OTEL_LOGS_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: pnpm-store
        uses: openclaw/openclaw/.github/actions/setup-pnpm-store-cache@97abb65691d97ee95c977a9a4ede2ef221d6929c
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: read-write
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - run: bash scripts/ci/setup-tools.sh images
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: success() && steps.pnpm-store.outputs.store-cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: ${{ steps.pnpm-store.outputs.store-cache-primary-key }}
      - run: node scripts/ci/prepare.mjs --lane docker-model --state "$RUNNER_TEMP/state/docker-model.json" --github-env "$GITHUB_ENV"
      - run: node scripts/ci/run-tests.mjs run docker-model --state "$RUNNER_TEMP/state/docker-model.json" --results "$RUNNER_TEMP/results/docker-model.json"
      - if: always()
        run: node scripts/ci/cleanup.mjs --state "$RUNNER_TEMP/state/docker-model.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-results-docker-model
          path: ${{ runner.temp }}/results/docker-model.json
          if-no-files-found: error
          retention-days: 7

  k3d-model:
    name: k3d Model Runtime
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'k3d-model'
    timeout-minutes: 65
    environment: integration-model
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_TEST_KUBERNETES_GATEWAY_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_GATEWAY_IMAGE }}
      OCC_TEST_KUBERNETES_AGENT_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_AGENT_IMAGE }}
      NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: pnpm-store
        uses: openclaw/openclaw/.github/actions/setup-pnpm-store-cache@97abb65691d97ee95c977a9a4ede2ef221d6929c
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: read-write
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - run: bash scripts/ci/setup-tools.sh full
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: success() && steps.pnpm-store.outputs.store-cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: ${{ steps.pnpm-store.outputs.store-cache-primary-key }}
      - run: node scripts/ci/prepare.mjs --lane k3d-model --state "$RUNNER_TEMP/state/k3d-model.json" --github-env "$GITHUB_ENV"
      - run: node scripts/ci/run-tests.mjs run k3d-model --state "$RUNNER_TEMP/state/k3d-model.json" --results "$RUNNER_TEMP/results/k3d-model.json"
      - if: always()
        run: node scripts/ci/cleanup.mjs --state "$RUNNER_TEMP/state/k3d-model.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-results-k3d-model
          path: ${{ runner.temp }}/results/k3d-model.json
          if-no-files-found: error
          retention-days: 7

  gateway-routing:
    name: Gateway Routing
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'gateway-routing'
    timeout-minutes: 35
    environment: integration-routing
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_TEST_KUBERNETES_GATEWAY_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_GATEWAY_IMAGE }}
      OCC_TEST_KUBERNETES_AGENT_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_AGENT_IMAGE }}
      OCC_TEST_GATEWAY_CA_CERT_PEM: ${{ secrets.OCC_TEST_GATEWAY_CA_CERT_PEM }}
      OCC_TEST_GATEWAY_CA_KEY_PEM: ${{ secrets.OCC_TEST_GATEWAY_CA_KEY_PEM }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: pnpm-store
        uses: openclaw/openclaw/.github/actions/setup-pnpm-store-cache@97abb65691d97ee95c977a9a4ede2ef221d6929c
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: read-write
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Materialize routing CA
        run: |
          install -m 0700 -d "$RUNNER_TEMP/secrets"
          test -n "${OCC_TEST_GATEWAY_CA_CERT_PEM:-}"
          test -n "${OCC_TEST_GATEWAY_CA_KEY_PEM:-}"
          printf '%s' "$OCC_TEST_GATEWAY_CA_CERT_PEM" > "$RUNNER_TEMP/secrets/gateway-ca.crt"
          printf '%s' "$OCC_TEST_GATEWAY_CA_KEY_PEM" > "$RUNNER_TEMP/secrets/gateway-ca.key"
          chmod 0600 "$RUNNER_TEMP/secrets/gateway-ca.crt" "$RUNNER_TEMP/secrets/gateway-ca.key"
          echo "OCC_TEST_GATEWAY_CA_CERT_PATH=$RUNNER_TEMP/secrets/gateway-ca.crt" >> "$GITHUB_ENV"
          echo "OCC_TEST_GATEWAY_CA_KEY_PATH=$RUNNER_TEMP/secrets/gateway-ca.key" >> "$GITHUB_ENV"
      - run: bash scripts/ci/setup-tools.sh full
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: success() && steps.pnpm-store.outputs.store-cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: ${{ steps.pnpm-store.outputs.store-cache-primary-key }}
      - run: node scripts/ci/prepare.mjs --lane gateway-routing --state "$RUNNER_TEMP/state/gateway-routing.json" --github-env "$GITHUB_ENV"
      - run: node scripts/ci/run-tests.mjs run gateway-routing --state "$RUNNER_TEMP/state/gateway-routing.json" --results "$RUNNER_TEMP/results/gateway-routing.json"
      - if: always()
        run: node scripts/ci/cleanup.mjs --state "$RUNNER_TEMP/state/gateway-routing.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-results-gateway-routing
          path: ${{ runner.temp }}/results/gateway-routing.json
          if-no-files-found: error
          retention-days: 7

  production-tui:
    name: Production TUI
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'production-tui'
    timeout-minutes: 50
    environment: integration-model
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_TEST_PRODUCTION_CONTROLLER_IMAGE: ${{ vars.OCC_TEST_PRODUCTION_CONTROLLER_IMAGE }}
      OCC_TEST_KUBERNETES_RUNTIME_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_RUNTIME_IMAGE }}
      OCC_TEST_PRODUCTION_POSTGRES_IMAGE: ${{ vars.OCC_TEST_PRODUCTION_POSTGRES_IMAGE }}
      OCC_TEST_PRODUCTION_NODE_IMAGE: ${{ vars.OCC_TEST_PRODUCTION_NODE_IMAGE }}
      OCC_TEST_OTEL_LOGS_URL: ${{ vars.OCC_TEST_OTEL_LOGS_URL }}
      NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: pnpm-store
        uses: openclaw/openclaw/.github/actions/setup-pnpm-store-cache@97abb65691d97ee95c977a9a4ede2ef221d6929c
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: read-write
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - run: bash scripts/ci/setup-tools.sh full
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: success() && steps.pnpm-store.outputs.store-cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: ${{ steps.pnpm-store.outputs.store-cache-primary-key }}
      - run: node scripts/ci/prepare.mjs --lane production-tui --state "$RUNNER_TEMP/state/production-tui.json" --github-env "$GITHUB_ENV"
      - run: node scripts/ci/run-tests.mjs run production-tui --state "$RUNNER_TEMP/state/production-tui.json" --results "$RUNNER_TEMP/results/production-tui.json"
      - if: always()
        run: node scripts/ci/cleanup.mjs --state "$RUNNER_TEMP/state/production-tui.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-results-production-tui
          path: ${{ runner.temp }}/results/production-tui.json
          if-no-files-found: error
          retention-days: 7

  slack:
    name: Slack Live
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'slack'
    timeout-minutes: 35
    environment: integration-slack
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_TEST_KUBERNETES_GATEWAY_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_GATEWAY_IMAGE }}
      OCC_TEST_KUBERNETES_AGENT_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_AGENT_IMAGE }}
      OCC_TEST_SLACK_PROXY_URL: ${{ vars.OCC_TEST_SLACK_PROXY_URL }}
      OCC_TEST_SLACK_CHANNEL_ID: ${{ vars.OCC_TEST_SLACK_CHANNEL_ID }}
      OCC_TEST_SLACK_SENDER_BOT_TOKEN: ${{ secrets.OCC_TEST_SLACK_SENDER_BOT_TOKEN }}
      SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: pnpm-store
        uses: openclaw/openclaw/.github/actions/setup-pnpm-store-cache@97abb65691d97ee95c977a9a4ede2ef221d6929c
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: read-write
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - run: bash scripts/ci/setup-tools.sh full
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: success() && steps.pnpm-store.outputs.store-cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: ${{ steps.pnpm-store.outputs.store-cache-primary-key }}
      - run: node scripts/ci/prepare.mjs --lane slack --state "$RUNNER_TEMP/state/slack.json" --github-env "$GITHUB_ENV"
      - run: node scripts/ci/run-tests.mjs run slack --state "$RUNNER_TEMP/state/slack.json" --results "$RUNNER_TEMP/results/slack.json"
      - if: always()
        run: node scripts/ci/cleanup.mjs --state "$RUNNER_TEMP/state/slack.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-results-slack
          path: ${{ runner.temp }}/results/slack.json
          if-no-files-found: error
          retention-days: 7

  provider-account:
    name: Provider Account
    runs-on: ubuntu-24.04
    needs: preflight
    if: inputs.lane == 'all' || inputs.lane == 'provider-account'
    timeout-minutes: 25
    environment: integration-provider-account
    env:
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
      OCC_TEST_KUBERNETES_GATEWAY_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_GATEWAY_IMAGE }}
      OCC_TEST_KUBERNETES_AGENT_IMAGE: ${{ vars.OCC_TEST_KUBERNETES_AGENT_IMAGE }}
      OCC_TEST_CHATGPT_WORKSPACE_ID: ${{ vars.OCC_TEST_CHATGPT_WORKSPACE_ID }}
      OCC_TEST_CHATGPT_ADMIN_KEY_JSON: ${{ secrets.OCC_TEST_CHATGPT_ADMIN_KEY_JSON }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: pnpm-store
        uses: openclaw/openclaw/.github/actions/setup-pnpm-store-cache@97abb65691d97ee95c977a9a4ede2ef221d6929c
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: read-write
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Materialize provider admin key
        run: |
          install -m 0700 -d "$RUNNER_TEMP/secrets"
          test -n "${OCC_TEST_CHATGPT_ADMIN_KEY_JSON:-}"
          printf '%s' "$OCC_TEST_CHATGPT_ADMIN_KEY_JSON" > "$RUNNER_TEMP/secrets/chatgpt-admin-key.json"
          chmod 0600 "$RUNNER_TEMP/secrets/chatgpt-admin-key.json"
          echo "OCC_TEST_CHATGPT_ADMIN_KEY_PATH=$RUNNER_TEMP/secrets/chatgpt-admin-key.json" >> "$GITHUB_ENV"
